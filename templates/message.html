{% extends "layout.html" %}
{% from "_icons.html" import icon, state_badge %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card" style="max-width:560px;margin:40px auto">
  <div class="sealed">
    <div class="sealed-icon">{{ icon('lock') }}</div>
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <a class="btn btn-primary" style="margin-top:18px" href="{{ url_for('dashboard') }}">{{ icon('arrow-left') }}Back to dashboard</a>
  </div>
</section>
{% endblock %}
